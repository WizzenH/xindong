[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salary-motivator"
dynamic = ["version"]
description = "薪动 · 可置顶、可收进托盘的每日工资计数器"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "WizzenH"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
]

[project.gui-scripts]
salary-motivator = "salary_motivator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salary_motivator = ["assets/*.svg", "assets/*.ico"]

[tool.setuptools.dynamic]
version = {attr = "salary_motivator.__version__"}

[tool.black]
line-length = 88
target-version = ["py38"]
